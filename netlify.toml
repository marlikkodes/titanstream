[build]
  command = "pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"
# Set VITE_API_BASE_URL and VITE_TELEGRAM_BOT_USERNAME in Netlify's production
# environment. Do not commit a stale deployment host into the build config.

# SPA Fallback Redirects for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
