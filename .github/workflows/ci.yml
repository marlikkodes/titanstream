name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    env:
      CI: true
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      JWT_SECRET: "ci-test-jwt-secret-do-not-use-in-production-12345678"
      ADMIN_INTERNAL_API_SECRET: "ci-test-internal-secret-12345678"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web application
        run: pnpm run lint

      - name: Generate Prisma Client
        run: pnpm --filter @titanstream/api prisma:generate

      - name: Build API service
        run: pnpm run build:api

      - name: Build Web application
        run: pnpm run build:web

      - name: Build Worker service
        run: pnpm --filter @titanstream/worker build

      - name: Run Core Auth & Lifecycle Unit Tests
        run: |
          pnpm --filter @titanstream/api test \
            src/modules/notification/baileys-lifecycle-verification.spec.ts \
            src/modules/auth/whatsapp-challenge-regression.spec.ts \
            src/modules/auth/whatsapp-challenge-token-persistence.spec.ts \
            src/modules/notification/baileys-persistence-certification.spec.ts \
            src/modules/auth/strategies/telegram-auth.service.spec.ts
