# TitanStream Docker Compose
# Local Execution & Verification

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titanstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titanstream_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-titanstream}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titanstream}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── NestJS API ──────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3002}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - baileys_auth:/app/services/api/baileys_auth_info
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-titanstream}:${POSTGRES_PASSWORD:-titanstream_secret_pass_2026}@postgres:5432/${POSTGRES_DB:-titanstream}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long_12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_at_least_32_characters_long_12345}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-dummy_telegram_bot_token}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-http://localhost:8080}
      SUPER_ADMIN_TELEGRAM_IDS: ${SUPER_ADMIN_TELEGRAM_IDS:-123456789}
      ADMIN_SESSION_PEPPER: ${ADMIN_SESSION_PEPPER:-}
      USDT_RECEIVING_ADDRESS: ${USDT_RECEIVING_ADDRESS:-}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-}
      PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL:-http://localhost:3000/api/v1/payments/callback}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── TitanStream Operations & Queue Worker ────────────────────
  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-titanstream}:${POSTGRES_PASSWORD:-titanstream_secret_pass_2026}@postgres:5432/${POSTGRES_DB:-titanstream}
      NODE_ENV: ${NODE_ENV:-production}

  # ── Frontend (Vite → Caddy static serve) ────────────────────
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  # ── Caddy — automatic HTTPS reverse proxy (Optional Gateway) ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  baileys_auth:
  caddy_data:
  caddy_config:
